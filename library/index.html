<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>The Library | Charlie Guthmann</title>
    <style>
        * { box-sizing: border-box; margin: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #241b12;
            color: #d9c9a3;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding: 14px 26px 10px;
            border-bottom: 1px solid #4a3826;
        }
        header h1 {
            font-weight: normal;
            font-size: 1.05em;
            letter-spacing: 5px;
            text-transform: uppercase;
        }
        header .sub {
            font-family: 'Courier New', monospace;
            font-size: 0.62em;
            letter-spacing: 2px;
            color: #a08a5c;
        }
        .searchbox {
            background: #f6efdd;
            border: 2px solid #8a6d3b;
            border-radius: 2px;
            padding: 4px 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.72em;
            color: #332a1e;
            width: 200px;
        }
        .searchbox:focus { outline: 1px solid #c9a95c; }

        .case {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            padding: 6px 26px 0;
            min-height: 0;
        }
        .shelf {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 64px;
            border-bottom: 9px solid #1a1108;
            background: linear-gradient(180deg, #1d150c, #191108 70%, #130d07);
            box-shadow: 0 3px 0 #3a2c1c,
                        0 7px 12px rgba(0,0,0,0.45),
                        inset 0 16px 26px -14px rgba(0,0,0,0.65);
            padding: 0 8px;
        }
        .cluster { display: flex; flex-direction: column; }
        .books { display: flex; align-items: flex-end; }
        .plaque {
            font-family: 'Courier New', monospace;
            font-size: 0.56em;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #caa963;
            background: linear-gradient(#4a3826, #332616);
            border: 1px solid #16100a;
            border-radius: 2px;
            text-align: center;
            padding: 2px 6px;
            margin: 0 4px;
            position: relative;
            top: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        a.book {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 46px;
            border-radius: 3px 3px 0 0;
            padding: 10px 0 5px;
            margin-left: 2px;
            text-decoration: none;
            box-shadow: inset -4px 0 6px rgba(0,0,0,0.45),
                        inset 2px 0 3px rgba(255,255,255,0.12),
                        2px 0 5px rgba(0,0,0,0.45);
            border-top: 3px double rgba(233,214,166,0.55);
            transition: transform 0.12s, opacity 0.2s, filter 0.12s;
            position: relative;
        }
        a.book.gilt { border-top-color: rgba(235,201,122,0.8); }
        a.book.gilt .spine-title { color: #eacd85; }
        a.book.starred { padding-top: 24px; }
        .book-star {
            position: absolute;
            top: 6px;
            color: #f1cd73;
            font-size: 12px;
            line-height: 1;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        a.book.pulled { transform: translateY(-5px); }
        a.book:hover { transform: translateY(-8px); filter: brightness(1.08); }
        a.book:focus-visible {
            transform: translateY(-8px);
            outline: 2px solid #c9a95c;
            outline-offset: 2px;
        }
        a.book.dim { opacity: 0.13; pointer-events: none; }
        .orn {
            font-size: 9px;
            line-height: 1;
            color: rgba(233,205,146,0.85);
            text-shadow: 0 1px 1px rgba(0,0,0,0.6);
            margin-top: 5px;
        }
        .spine-title {
            writing-mode: vertical-rl;
            font-size: clamp(9px, 1.55vh, 13px); /* scales with vh-based book heights */
            letter-spacing: 0.5px;
            color: #f0e4c4;
            text-shadow: 0 1px 1px rgba(0,0,0,0.7);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            max-height: 100%;
        }
        .tag {
            font-family: 'Courier New', monospace;
            font-size: 9px;
            color: #2f2618;
            background: #ece1c3;
            border-radius: 1px;
            padding: 0 2px;
            margin-top: 6px;
        }

        /* the index card that pops up on hover */
        #tip {
            position: fixed;
            display: none;
            width: 290px;
            z-index: 10;
            background: repeating-linear-gradient(#fffdf4 0 24px, #dce7ef 24px 25px);
            background-color: #fffdf4;
            border: 1px solid #c9bfa4;
            border-radius: 2px;
            padding: 26px 14px 12px;
            box-shadow: 3px 5px 14px rgba(0,0,0,0.6);
            color: #332a1e;
            pointer-events: none;
        }
        #tip::before {
            content: '';
            position: absolute;
            left: 0; right: 0; top: 20px;
            border-top: 1.5px solid #c76b5b;
        }
        #tip .call {
            position: absolute;
            top: 4px; left: 14px;
            font-family: 'Courier New', monospace;
            font-size: 0.68em;
            color: #8a6d3b;
            letter-spacing: 1px;
        }
        #tip .t { font-size: 0.9em; color: #1f3d5c; }
        #tip .d { font-size: 0.76em; color: #55492f; line-height: 1.5; margin-top: 2px; }
        #tip .m {
            font-family: 'Courier New', monospace;
            font-size: 0.62em;
            color: #99855c;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        footer {
            display: flex;
            justify-content: space-between;
            padding: 8px 26px 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.66em;
            letter-spacing: 1px;
        }
        footer a { color: #b39a67; text-decoration: none; }
        footer a:hover { color: #e8d9b0; }
        footer .count { color: #a08a5c; }

        /* small screens: let it scroll rather than cram */
        @media (max-width: 980px) {
            body { overflow: auto; }
            .case { padding: 6px 12px 0; }
            .shelf { flex-wrap: wrap; gap: 12px; border-bottom: none; }
            .cluster { border-bottom: 9px solid #120d08; padding-top: 12px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>The Library</h1>
        <div class="sub" id="sub">GUTHMANN COLLECTION · UNLISTED</div>
        <input class="searchbox" id="q" type="search" placeholder="search the stacks…" autocomplete="off" aria-label="search the stacks">
    </header>

    <div class="case" id="case"></div>

    <footer>
        <span><a href="/">← home</a> &nbsp;·&nbsp; <a href="/research/">research index</a></span>
        <span class="count" id="count"></span>
        <span>hover a spine for its card · click to pull it</span>
    </footer>

    <div id="tip"></div>

    <script src="catalog.js"></script>
    <script>
    // Catalog data (sections, shelves, entries) lives in catalog.js —
    // shared with /assets/site-nav.js, which draws the toolbar on member pages.
    const { SECTIONS, SHELVES, ENTRIES } = window.LIBRARY;

    const tip = document.getElementById('tip');
    const kase = document.getElementById('case');

    function shade(hex, f) {  // lighten/darken a hex color by factor f
        const n = parseInt(hex.slice(1), 16);
        const c = i => Math.min(255, Math.max(0, Math.round(((n >> i) & 255) * f)));
        return `rgb(${c(16)},${c(8)},${c(0)})`;
    }
    function hash(s) {
        let h = 0;
        for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 997;
        return h;
    }

    SHELVES.forEach(keys => {
        const shelf = document.createElement('div');
        shelf.className = 'shelf';
        keys.forEach(key => {
            const sec = SECTIONS[key];
            const items = ENTRIES.filter(e => e[0] === key);
            const cluster = document.createElement('div');
            cluster.className = 'cluster';
            const books = document.createElement('div');
            books.className = 'books';
            items.forEach((e, i) => {
                const [k, url, title, desc, date, starred] = e;
                const call = k + '.' + String(i + 1).padStart(2, '0');
                const b = document.createElement('a');
                b.className = 'book';
                b.href = url;
                if (starred) b.classList.add('starred');
                const h = hash(title);
                // height tracks title length so long titles never truncate,
                // with a little per-book jitter so the row reads hand-shelved
                const hgt = Math.min(24, Math.max(15.5, 10 + title.length * 0.55 + (h % 5) * 0.5));
                b.style.height = hgt + 'vh';
                b.style.width = (h % 4 === 0 ? 58 : [42, 46, 46, 50, 46, 52][h % 6]) + 'px';
                if (h % 7 === 0) b.style.marginLeft = '8px';       // loosely packed gap
                if (h % 13 === 0) b.classList.add('pulled');       // left half-pulled off the shelf
                if (h % 5 === 0) b.classList.add('gilt');          // gilt lettering + headcap
                // leather: per-book hue jitter + sheen + grain, and for some
                // volumes gold tooling lines or raised binding cords — all
                // background layers, so the lettering stays on top.
                const j = 0.92 + (h % 5) * 0.045;   // per-book lighten/darken jitter
                const layers = [
                    'linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0) 16%, rgba(0,0,0,0) 78%, rgba(0,0,0,0.30))',
                    'repeating-linear-gradient(90deg, rgba(0,0,0,0.06) 0 1px, rgba(0,0,0,0) 1px 3px)',
                ];
                if (h % 3 === 0) layers.push(                      // tooling near head & tail
                    'linear-gradient(180deg, rgba(0,0,0,0) 0 6.5%, rgba(233,205,146,0.32) 6.5% 7.3%, rgba(18,11,6,0.45) 8.1% 8.9%, rgba(0,0,0,0) 9.7% 87%, rgba(233,205,146,0.32) 87% 87.8%, rgba(18,11,6,0.45) 88.6% 89.4%, rgba(0,0,0,0) 90.2%)');
                else if (h % 6 === 1) layers.push(                 // raised sewing cords
                    'repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 9%, rgba(18,11,6,0.30) 9% 9.9%, rgba(255,235,190,0.16) 9.9% 10.8%, rgba(0,0,0,0) 10.8% 20%)');
                layers.push(`linear-gradient(90deg, ${shade(sec.hue, 0.72 * j)}, ${shade(sec.hue, j)} 45%, ${shade(sec.hue, 1.28 * j)} 55%, ${shade(sec.hue, 0.78 * j)})`);
                b.style.background = layers.join(',');
                b.dataset.text = (call + ' ' + title + ' ' + desc + ' ' + date + ' ' + sec.name + (starred ? ' starred' : '')).toLowerCase();
                b.title = (starred ? '★ ' : '') + title + ' — ' + desc; // touch/no-hover fallback
                const orn = hgt > 18.5 ? '<span class="orn">' + ['❧', '✦', '◆'][h % 3] + '</span>' : '';
                const star = starred ? '<span class="book-star" aria-hidden="true">★</span>' : '';
                b.innerHTML = star + '<span class="spine-title">' + title + '</span>' + orn + '<span class="tag">' + call + '</span>';
                const showTip = () => {
                    tip.innerHTML = '<span class="call">' + call + ' · ' + sec.name + '</span>' +
                        '<div class="t">' + (starred ? '★ ' : '') + title + '</div>' +
                        '<div class="d">' + desc + '</div>' +
                        '<div class="m">acc. ' + date + '</div>';
                    tip.style.display = 'block';
                    const r = b.getBoundingClientRect();
                    const th = tip.offsetHeight;
                    let top = r.top - th - 12;                      // prefer above the spine
                    if (top < 54) top = Math.min(r.bottom + 12, innerHeight - th - 8);
                    tip.style.top = top + 'px';
                    tip.style.left = Math.max(8, Math.min(r.left - 40, innerWidth - 306)) + 'px';
                };
                const hideTip = () => tip.style.display = 'none';
                b.addEventListener('mouseenter', showTip);
                b.addEventListener('mouseleave', hideTip);
                b.addEventListener('focus', showTip);
                b.addEventListener('blur', hideTip);
                books.appendChild(b);
            });
            const plaque = document.createElement('div');
            plaque.className = 'plaque';
            plaque.textContent = sec.name + ' · ' + key;
            cluster.appendChild(books);
            cluster.appendChild(plaque);
            shelf.appendChild(cluster);
        });
        kase.appendChild(shelf);
    });

    const counter = document.getElementById('count');
    counter.textContent = ENTRIES.length + ' / ' + ENTRIES.length;
    document.getElementById('sub').textContent =
        'GUTHMANN COLLECTION · ' + ENTRIES.length + ' VOLUMES · UNLISTED';
    const search = document.getElementById('q');
    search.addEventListener('input', () => {
        const q = search.value.trim().toLowerCase();
        let n = 0;
        document.querySelectorAll('a.book').forEach(b => {
            const hit = !q || b.dataset.text.includes(q);
            b.classList.toggle('dim', !hit);
            b.tabIndex = hit ? 0 : -1;
            if (hit) n++;
        });
        counter.textContent = n + ' / ' + ENTRIES.length;
    });
    search.addEventListener('keydown', ev => {
        if (ev.key === 'Escape') {
            search.value = '';
            search.dispatchEvent(new Event('input'));
        }
    });
    </script>
</body>
</html>
